name: PR Tests
on:
  pull_request_target:
    types: [synchronize, labeled]
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.check-scope.outputs.scope }}
      is_trusted: ${{ steps.check-scope.outputs.is_trusted }}
    steps:
      - name: check-scope
        id: check-scope
        run: |
          echo "action=${{ github.event.action }}" >> $GITHUB_STEP_SUMMARY
          echo "actor=${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          # LAB: conta única → todo PR author simula UNTRUSTED (cenário do ataque real;
          # no alvo ddavis-2015 também resolveu untrusted). Reviewer = mesma conta,
          # espelhando prevent_self_review:false do environment real.
          echo "is_trusted=false" >> $GITHUB_OUTPUT
          # scope derivado de labels + 'labeled' override (mesma lógica do alvo)
          labels='${{ join(github.event.pull_request.labels.*.name, ' ') }}'
          label_ev='${{ github.event.label.name }}'
          scope="none"
          if echo "$labels" | grep -q "ci:full"; then scope="all"; fi
          if [ "$label_ev" = "ci:full" ] && [ "${{ github.event.action }}" = "labeled" ]; then scope="all"; fi
          echo "scope=$scope" >> $GITHUB_OUTPUT

  approval-gate:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.scope != 'none'
    runs-on: ubuntu-latest
    environment: ${{ needs.gatekeeper.outputs.is_trusted == 'false' && 'integration-test' || '' }}
    steps:
      - name: Authorize
        run: echo "CI Authorized."

  call-consumer:
    needs: [gatekeeper, approval-gate]
    if: needs.gatekeeper.outputs.scope != 'none'
    uses: ./.github/workflows/consumer.yml
    with:
      trigger-sha: ${{ github.event.pull_request.head.sha }}
    secrets:
      lab-token: ${{ secrets.LAB_PACKAGE_READ_TOKEN }}
